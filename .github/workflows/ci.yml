name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow_failure }}
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            allow_failure: false
          - version: '1'
            os: ubuntu-latest
            arch: x64
            allow_failure: false
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64
            allow_failure: true
          - version: '1.10'
            os: windows-latest
            arch: x64
            allow_failure: false
          - version: '1'
            os: windows-latest
            arch: x64
            allow_failure: false
          - version: 'nightly'
            os: windows-latest
            arch: x64
            allow_failure: true
          - version: '1.10'
            os: macos-latest
            arch: aarch64
            allow_failure: false
          - version: '1'
            os: macos-latest
            arch: aarch64
            allow_failure: false
          - version: 'nightly'
            os: macos-latest
            arch: aarch64
            allow_failure: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          use_oidc: true

  diagram-renderer:
    name: Diagram renderer - ${{ matrix.renderer }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: PlantUML
            format: plantuml
            input: machine.puml
            image: ghcr.io/plantuml/plantuml:1.2026.6
          - renderer: Mermaid
            format: mermaid
            input: machine.mmd
            image: ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:11.16.0
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Generate ${{ matrix.renderer }} source
        run: >-
          julia --project=. test/generate_diagram_fixture.jl
          "${{ matrix.format }}"
          "$RUNNER_TEMP/hsm-diagrams/${{ matrix.input }}"
      - name: Render with PlantUML
        if: matrix.format == 'plantuml'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/hsm-diagrams:/data" \
            "${{ matrix.image }}" \
            -tsvg /data/machine.puml
          test -s "$RUNNER_TEMP/hsm-diagrams/machine.svg"
          grep -q '<svg' "$RUNNER_TEMP/hsm-diagrams/machine.svg"
      - name: Render with Mermaid
        if: matrix.format == 'mermaid'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/hsm-diagrams:/data" \
            "${{ matrix.image }}" \
            -i /data/machine.mmd \
            -o /data/machine-mermaid.svg
          test -s "$RUNNER_TEMP/hsm-diagrams/machine-mermaid.svg"
          grep -q '<svg' "$RUNNER_TEMP/hsm-diagrams/machine-mermaid.svg"
